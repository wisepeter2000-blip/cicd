name: CI

on:
  push:

jobs:
  hello:
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Say hello
        run: echo hello

      - name: Check v1.txt length
        shell: powershell
        run: |
          $count = (Get-Content -Raw -Path v1.txt).Length
          Write-Output "v1.txt has $count characters"
          if ($count -gt 30) {
            Write-Output "v1.txt exceeds the 30-character limit."
            exit 1
          }
